{% extends "base.html" %}
{% block title %}Edit Profile - GradeVault{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h2>Edit Student Profile</h2>
        <p>Update your personal academic details.</p>
    </div>
</div>

<div class="form-card">

    {% if error %}
        <p class="form-error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ student.name }}"
            required
        >
        
        <label for="roll_number">Roll Number</label>
        <input
            type="text"
            id="roll_number"
            name="roll_number"
            value="{{ student.roll_number }}"
            required
        >

        <button type="submit">Save Changes</button>
    </form>

    <a href="/" class="back-link">Back to Dashboard</a>

</div>

{% endblock %}
