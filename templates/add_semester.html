{% extends "base.html" %}
{% block title %}Add Semester - GradeVault{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h2>Add Semester</h2>
        <p>Create a new semester for your academic record.</p>
    </div>
</div>

<div class="form-card">
    {% if error %}
        <p class="form-error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="number">Semester Number</label>
        <input
            type="number"
            id="number"
            name="number"
            min="1"
            required
        >

        <button type="submit">Add Semester</button>
    </form>

    <a href="/" class="back-link">Back to Dashboard</a>
</div>

{% endblock %}
